name: daily-signal

on:
  schedule:
    # GitHub 的排程常延遲好幾小時或漏跑（實測 11/13–11/16 只觸發 2 次），所以每小時都試一次。
    # run_daily.py 會判斷：盤中不跑；線上已是最近收盤日的官方收盤訊號就跳過；否則補上。
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "不管時段強制重算（填 yes）"
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: sig
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force }}" = "yes" ]; then python run_daily.py --force | tee run.log; else python run_daily.py | tee run.log; fi
          echo "result=$(tail -1 run.log | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # 每天把訊號記一筆進 history/signals.csv 並提交：留紀錄，也讓 repo 保持活躍
      # （GitHub 會停用 60 天沒有提交的 repo 的排程）
      - if: steps.sig.outputs.result == 'RESULT=UPDATED' && github.event_name != 'push'
        run: |
          python log_signal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/signals.csv
          git diff --cached --quiet || (git commit -m "signal $(date -u +%F)" && git push)
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/configure-pages@v5
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages 偶爾會在 artifact 剛上傳完時查不到它（"No artifacts named github-pages"），
      # 所以先等幾秒，失敗再等 30 秒重試一次。
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        run: sleep 10
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.sig.outputs.result == 'RESULT=UPDATED' && steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.sig.outputs.result == 'RESULT=UPDATED' && steps.deploy.outcome == 'failure'
        id: deploy2
        uses: actions/deploy-pages@v4
