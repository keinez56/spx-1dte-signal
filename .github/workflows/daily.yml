name: daily-signal

on:
  schedule:
    # 收盤後跑：美東 17:15 左右（ES 日 K 17:00 收完），GitHub cron 用 UTC。
    # 21:15 UTC = 夏令 17:15 ET；22:15 UTC = 冬令 17:15 ET（夏令時是 18:15，也在時段內）。
    # run_daily.py 只在 17:05–20:00 ET 執行，其他時段跳過。
    - cron: "15 21,22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "不管時段強制重算（填 yes）"
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: sig
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force }}" = "yes" ]; then python run_daily.py --force | tee run.log; else python run_daily.py | tee run.log; fi
          echo "result=$(tail -1 run.log | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/configure-pages@v5
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        id: deploy
        uses: actions/deploy-pages@v4
