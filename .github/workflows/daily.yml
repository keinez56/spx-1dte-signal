name: daily-signal

on:
  schedule:
    # 現貨收盤後跑：目標美東 16:15（台灣冬令 05:15、夏令 04:15）。GitHub cron 用 UTC。
    # GitHub 的排程常延遲或漏跑，所以 20:15–23:55 UTC 每 20 分鐘試一次；
    # run_daily.py 只在 16:05–20:00 ET 執行，且當天已更新過就跳過，所以不會重複發布。
    - cron: "15,35,55 20,21,22,23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "不管時段強制重算（填 yes）"
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: sig
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force }}" = "yes" ]; then python run_daily.py --force | tee run.log; else python run_daily.py | tee run.log; fi
          echo "result=$(tail -1 run.log | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # 每天把訊號記一筆進 history/signals.csv 並提交：留紀錄，也讓 repo 保持活躍
      # （GitHub 會停用 60 天沒有提交的 repo 的排程）
      - if: steps.sig.outputs.result == 'RESULT=UPDATED' && github.event_name != 'push'
        run: |
          python log_signal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/signals.csv
          git diff --cached --quiet || (git commit -m "signal $(date -u +%F)" && git push)
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/configure-pages@v5
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.sig.outputs.result == 'RESULT=UPDATED'
        id: deploy
        uses: actions/deploy-pages@v4
